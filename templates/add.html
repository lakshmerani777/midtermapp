{% extends "base.html" %}

{% block title %}Add Book — Library Manager{% endblock %}

{% block content %}
<h1>➕ Add a New Book</h1>

<div class="form-card">
    <form method="POST" action="{{ url_for('add_book') }}">

        <div class="form-group">
            <label for="book_id">Book ID</label>
            <input type="text" id="book_id" name="book_id" placeholder="e.g. BK001" required>
        </div>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="e.g. The Great Gatsby" required>
        </div>

        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" placeholder="e.g. F. Scott Fitzgerald" required>
        </div>

        <div class="form-group">
            <label for="genre">Genre</label>
            <input type="text" id="genre" name="genre" placeholder="e.g. Fiction" required>
        </div>

        <div class="form-group">
            <label for="available_copies">Available Copies</label>
            <input type="number" id="available_copies" name="available_copies" min="0" placeholder="e.g. 5" required>
        </div>

        <button type="submit" class="btn btn-success">Add Book</button>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Cancel</a>

    </form>
</div>
{% endblock %}
