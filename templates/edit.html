{% extends "base.html" %}

{% block title %}Edit Book — Library Manager{% endblock %}

{% block content %}
<h1>✏️ Edit Book</h1>

<div class="form-card">
    <form method="POST" action="{{ url_for('edit_book', bookid=book.BookID) }}">

        <!-- BookID is the primary key — shown but not editable -->
        <div class="form-group">
            <label for="book_id">Book ID</label>
            <input type="text" id="book_id" value="{{ book.BookID }}" disabled>
        </div>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ book.Title }}" required>
        </div>

        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" value="{{ book.Author }}" required>
        </div>

        <div class="form-group">
            <label for="genre">Genre</label>
            <input type="text" id="genre" name="genre" value="{{ book.Genre }}" required>
        </div>

        <div class="form-group">
            <label for="available_copies">Available Copies</label>
            <input type="number" id="available_copies" name="available_copies" min="0" value="{{ book.AvailableCopies }}" required>
        </div>

        <button type="submit" class="btn btn-success">Update Book</button>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Cancel</a>

    </form>
</div>
{% endblock %}
