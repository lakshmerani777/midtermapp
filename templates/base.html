<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library Book Management{% endblock %}</title>
    <style>
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        /* ===== Navigation Bar ===== */
        nav {
            background-color: #2c3e50;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav .brand {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
        }

        nav .nav-links a {
            color: #ecf0f1;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav .nav-links a:hover {
            color: #1abc9c;
        }

        /* ===== Main Content Container ===== */
        .container {
            max-width: 960px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1, h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* ===== Flash Messages ===== */
        .flash {
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .flash.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ===== Table Styles ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        thead {
            background-color: #2c3e50;
            color: #fff;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background-color 0.15s;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        /* ===== Buttons & Links ===== */
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background-color: #3498db;
        }

        .btn-success {
            background-color: #27ae60;
        }

        .btn-warning {
            background-color: #f39c12;
        }

        .btn-danger {
            background-color: #e74c3c;
        }

        /* ===== Forms ===== */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .form-card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            max-width: 550px;
        }

        /* ===== Search Bar ===== */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-bar input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        /* ===== Misc ===== */
        .actions a {
            margin-right: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <a class="brand" href="{{ url_for('index') }}">📚 Library Manager</a>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('add_book') }}">+ Add Book</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Flash Messages (success / error notifications) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
